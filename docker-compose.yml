services:
  shigure_core:
    build: .
    network_mode: host
    # launch引数は .env の DEBUG_MODE / SAVE_IMAGE / ENABLE_PROFILE で変更できる
    command: >
      ros2 launch shigure_core shigure_core_launch.py
      terminal:=xterm record:=true save_root_path:=/ros2_ws/events
      debug_mode:=${DEBUG_MODE:-true}
      save_image:=${SAVE_IMAGE:-false}
      enable_profile:=${ENABLE_PROFILE:-false}
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      # 顔辞書(登録ユーザーの特徴・画像)をホストと共有し、コンテナ再作成後も保持する
      - ~/.shigure:/root/.shigure
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: shigure
      MYSQL_DATABASE: shigure
      MYSQL_USER: shigure
      MYSQL_PASSWORD: shigure
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "shigure", "-pshigure"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./shigure_core/resource/db/migration:/migration
    command: ["-path", "/migration", "-database", "mysql://shigure:shigure@tcp(db:3306)/shigure", "up"]
    restart: on-failure

volumes:
  db_data:
